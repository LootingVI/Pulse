version: '3.8'

services:
  pulse:
    build: .
    container_name: pulse
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pulse_data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/pulse.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=generate-a-long-random-string-here
      # Optional: Healthcheck für automatische Restarts bei Fehlern
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pulse_data:
