version: '3.8'

services:
  pulse:
    build: .
    container_name: pulse
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pulse_data:/app/prisma/data
    environment:
      - DATABASE_URL=file:/app/prisma/data/pulse.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-change-me-in-production

volumes:
  pulse_data:
